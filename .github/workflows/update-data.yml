name: Update Market Data from Naver

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 봇에게 리포지토리 쓰기 권한 명시 부여
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 커밋 히스토리를 가져와 충돌 방지

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Build Wikipedia History Pool (Optional 1-run)
        run: |
          python scripts/build_wiki_history.py

      - name: Run collector script
        run: |
          python scripts/fetch_market.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # data.json과 humanities_pool.json 등 변경된 모든 파일을 함께 스테이징
          git add -A
          # 변경사항이 있을 때만 커밋
          git diff-index --quiet HEAD || git commit -m "Auto update market & history data [skip ci]"
          # 원격지 변경사항을 rebase로 병합 후 푸시
          git pull --rebase --autostash origin main
          git push origin main
