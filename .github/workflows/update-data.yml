name: Update Market Data from Naver

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# 봇에게 리포지토리 쓰기 권한 명시 부여
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 커밋 히스토리를 가져와 충돌 방지

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run collector script
        run: |
          python scripts/fetch_market.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # 변경사항이 없으면 에러 없이 정상 종료
          git diff-index --quiet HEAD || git commit -m "Auto update market rates [skip ci]"
          # 원격 변경사항을 먼저 합친 뒤 푸시 (충돌 방지)
          git pull --rebase origin main
          git push origin main
